<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mi sitio</title>
<link rel="stylesheet" href="estilo.css">
<!-- SDK de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<nav>
<a href="index.html">Inicio</a> | 
<a href="catalogo.html">Catálogo</a> | 
<a href="acerca.html">Acerca</a>
</nav>

<h1>Mi primer sitio web</h1>
<p>Hola, soy jhovani. Esta es mi página de inicio.</p>

<!-- Contenedor de Mensajes -->
<div id="ml"></div>

<!-- Formulario de Autenticación / Login -->
<div id="auth-section">
    <h3>Iniciar Sesión / Registrarse</h3>
    <input type="email" id="email" placeholder="Correo electrónico">
    <input type="password" id="pass" placeholder="Contraseña">
    <button onclick="entrar()">Entrar</button>
    <button onclick="registrar()">Crear Cuenta</button>
</div>

<!-- Panel de la Aplicación (Oculto hasta iniciar sesión) -->
<div id="app-section" style="display:none;">
    <h2>Panel de Solicitudes</h2>
    <input type="text" id="titulo" placeholder="Título de la solicitud">
    <input type="number" id="monto" placeholder="Monto">
    <button onclick="crearSolicitud()">Guardar Solicitud</button>
    <button onclick="salir()">Cerrar Sesión</button>
</div>

<script>
    // Función auxiliar para obtener valores y mostrar mensajes
    function val(id) {
        return document.getElementById(id).value;
    }

    function msg(id, texto, esExito) {
        const el = document.getElementById(id);
        el.innerText = texto;
        el.style.color = esExito ? 'green' : 'red';
    }

    function mostrarApp() {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
    }

    // 1. Registrar cuenta nueva
    async function registrar() {
        const { error } = await supabase.auth.signUp({ 
            email: val('email'), 
            password: val('pass') 
        });
        if (error) return msg('ml', 'Error: ' + error.message, false);
        msg('ml', 'Cuenta creada. Ya puedes iniciar sesión.', true);
    }

    // 2. Iniciar sesión
    async function entrar() {
        const { error } = await supabase.auth.signInWithPassword({ 
            email: val('email'), 
            password: val('pass') 
        });
        if (error) return msg('ml', 'Credenciales incorrectas', false);
        mostrarApp();
    }

    // 3. Cerrar sesión[cite: 4]
    async function salir() {
        await supabase.auth.signOut();
        document.getElementById('app-section').style.display = 'none';
        document.getElementById('auth-section').style.display = 'block';
        msg('ml', 'Sesión cerrada.', true);
    }

    // 4. Crear solicitud guardando el correo del usuario actual[cite: 4]
    async function crearSolicitud() {
        const titulo = val('titulo');
        const monto = val('monto');
        
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) return alert('Debes iniciar sesión');

        const { error } = await supabase.from('solicitudes').insert({ 
            titulo, 
            monto, 
            usuario_email: user.email 
        });

        if (error) {
            alert('Error al guardar: ' + error.message);
        } else {
            alert('Solicitud guardada con éxito');
            document.getElementById('titulo').value = '';
            document.getElementById('monto').value = '';
        }
    }

    // 5. Verificar sesión activa al cargar la página[cite: 4]
    (async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) mostrarApp();
    })();
</script>
</body>
</html>
